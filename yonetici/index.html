<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style id="appcss">
:root{--bg:#eef0f3;--card:#fff;--ink:#1b1d22;--mute:#6b7280;--line:#dfe3e8;--head:#8c0f1f;--head2:#6d0a17;--gold:#f5c518;--zebra:#f7f8fa;--bar:#8c0f1f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--ink:#eceef2;--mute:#9aa1ad;--line:#2d313a;--zebra:#22262d;--bar:#e0475a}}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--head);color:#fff}
.top{max-width:960px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.logo{font:800 30px/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.5px}
.logo b{color:var(--gold)}
.sub{font-size:13px;opacity:.85}
.tot{margin-left:auto;font:700 14px "Barlow Condensed",sans-serif;background:var(--head2);padding:4px 10px;border-radius:3px}
nav{max-width:960px;margin:10px auto 0;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{background:transparent;border:0;color:#fff;font:700 16px "Barlow Condensed",sans-serif;padding:10px 16px;cursor:pointer;opacity:.8;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{opacity:1;border-color:var(--gold);background:var(--head2)}
nav button:focus-visible,.row:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main{max-width:960px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font:700 13px "Barlow Condensed",sans-serif;text-align:left;padding:9px 10px;background:var(--head2);color:#fff}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.row{cursor:pointer}
.row:nth-child(even){background:var(--zebra)}
.row:hover,.row.sel{background:color-mix(in srgb,var(--gold) 22%,var(--card))}
.pos{font:800 18px "Barlow Condensed",sans-serif;width:36px;text-align:center}
.pos.l{background:var(--gold);color:#1b1d22}
.club{font:700 18px "Barlow Condensed",sans-serif}
.rip{color:var(--mute);font-weight:500;font-size:13px}
.num{font:800 22px "Barlow Condensed",sans-serif;text-align:center}
.barwrap{min-width:110px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar)}
.pct{font-size:12px;color:var(--mute)}
.btn{background:var(--head);color:#fff;border:0;border-radius:3px;font:700 14px "Barlow Condensed",sans-serif;padding:5px 10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.detail{margin-bottom:16px;border-left:6px solid var(--gold);padding:14px 16px;background:var(--card);border-radius:4px;border:1px solid var(--line);border-left-width:6px}
.detail h2{margin:0 0 2px;font:800 28px/1.1 "Barlow Condensed",sans-serif}
.kv{display:flex;flex-wrap:wrap;gap:8px 28px;margin:10px 0}
.kv div span{display:block;font-size:12px;color:var(--mute)}
.kv div b{font:800 22px "Barlow Condensed",sans-serif}
.cmt{margin:6px 0 0;max-width:68ch}
.hint{font-size:13px;color:var(--mute);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.card h3{margin:0;font:800 22px "Barlow Condensed",sans-serif}
.role{font-size:13px;color:var(--mute)}
.big{font:800 30px/1 "Barlow Condensed",sans-serif;margin:8px 0 2px}
.rank{border-top:4px solid var(--head)}
.rank.c1{border-color:var(--gold)}
.lg{width:44px;height:44px;object-fit:contain;vertical-align:middle;margin-right:10px}
.lg.ph{display:inline-flex;align-items:center;justify-content:center;color:#9aa1ad;font-size:20px}
.stars{color:#e0a800;font-size:.75em;letter-spacing:1px;margin-left:6px;white-space:nowrap}
.lg.big{width:84px;height:84px;margin:0 0 8px;display:block}
.club{display:inline-block;vertical-align:middle}
.pk{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:4px;padding:10px;cursor:pointer;color:var(--ink);font:700 18px "Barlow Condensed",sans-serif;text-align:left}
.pk[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--card))}
.pk .lg{margin:0;flex:none}
.pk:focus-visible,.sc:focus-visible{outline:2px solid var(--head);outline-offset:1px}
.step{font:800 24px "Barlow Condensed",sans-serif;margin:18px 0 6px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
.btn.big{font-size:17px;padding:9px 16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.st td{padding:8px 10px}
.st th:nth-child(n+3),.st td:nth-child(n+3){text-align:center}
.st tbody tr:nth-child(even){background:var(--zebra)}
.wk{margin-top:12px}
.wk h4{margin:0;padding:7px 10px;background:var(--head2);color:#fff;font:700 15px "Barlow Condensed",sans-serif}
.mt{display:grid;grid-template-columns:minmax(0,1fr) 46px 10px 46px minmax(0,1fr);gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.mt .tm{display:flex;align-items:center;gap:6px;font:700 16px "Barlow Condensed",sans-serif;min-width:0}
.mt .tm.h{justify-content:flex-end;text-align:right}
.mt .lg{width:26px;height:26px;margin:0;flex:none}
.mt .dash{text-align:center;color:var(--mute)}
.sc{width:46px;padding:5px 2px;text-align:center;font:700 16px Barlow,sans-serif;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.bye{padding:6px 10px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
.tie{display:flex;gap:8px;flex-wrap:wrap}
.bk{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 14px}
.bk summary{cursor:pointer;font:700 18px "Barlow Condensed",sans-serif}
.bk textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);font:12px monospace;padding:6px}
.hist{margin:0;padding:0;list-style:none}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.hist li:first-child{border-top:0}
.hist .lg{width:30px;height:30px;margin:0}
.nm{display:block;margin:6px 0}
.nm span{display:block;font-size:13px;color:var(--mute)}
.nm input{width:100%;max-width:420px;padding:9px 10px;font:600 17px Barlow,sans-serif;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
.sv{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 0 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.gi{width:84px;padding:5px;text-align:center;font:700 16px Barlow,sans-serif;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.bdform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}
.bdform input[type=text],.bdform select{padding:9px 10px;font:600 16px Barlow,sans-serif;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink);min-width:0;flex:1 1 160px}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);border:2px solid var(--gold)}
.av.ph{display:inline-flex;align-items:center;justify-content:center;font:800 24px "Barlow Condensed",sans-serif;color:var(--mute)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.pl .nm2{flex:1 1 140px;min-width:0}
.pl .nm2 b{font:800 20px "Barlow Condensed",sans-serif;display:block}
.pl .lg{width:20px;height:20px;margin:0 4px 0 0}
.cnt{font:800 28px "Barlow Condensed",sans-serif;white-space:nowrap}
.pm{display:flex;gap:6px}
.logo{display:flex;align-items:center;gap:10px}
.cm{width:42px;height:42px;flex:none}
</style>
</head>

var LD={"karpuz": [181, 174], "kuashi": [154, 176], "bize": [164, 166], "armut": [174, 196], "cibi": [178, 182], "erik": [172, 186], "bagyo": [176, 170], "chapeco": [200, 200]};
var LC={};
function starN(c){return Math.floor((c.kupa||0)/5)}
function starPath(cx,cy,R){var p=[];for(var i=0;i<10;i++){var r=i%2?R*0.42:R,a=-Math.PI/2+i*Math.PI/5;p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1))}return p.join(" ")}
function logoSrc(c){
  var base=logos[c.id];if(!base)return "";
  var n=starN(c),d=LD[c.id];
  if(n<1||!d)return base;
  var key=c.id+":"+n;if(LC[key])return LC[key];
  var W=d[0],H=d[1],sh=Math.round(H*0.2),R=Math.min(sh*0.4,W/(n*2.4+0.6)),sp=Math.min(R*2.3,(W-2*R)/Math.max(1,n-1)),pts="";
  for(var i=0;i<n;i++){
    var t=n>1?(i-(n-1)/2)/((n-1)/2):0,cx=W/2+(i-(n-1)/2)*sp,cy=n===1?sh*0.5:(sh*0.6-sh*0.2*(1-t*t));
    pts+='<polygon points="'+starPath(cx,cy,R)+'" fill="#f5c518" stroke="#a87b00" stroke-width="'+(R*0.1).toFixed(1)+'" stroke-linejoin="round"/>';
  }
  var svg='<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 '+W+' '+(H+sh)+'"><image x="0" y="'+sh+'" width="'+W+'" height="'+H+'" href="'+base+'" xlink:href="'+base+'"/>'+pts+'</svg>';
  return LC[key]="data:image/svg+xml;base64,"+btoa(svg);
}
function lg(c,big){var cl="lg"+(big?" big":"");return logos[c.id]?'<img class="'+cl+'" src="'+logoSrc(c)+'" alt="'+esc(c.club)+' logosu">':'<span class="'+cl+' ph" aria-hidden="true">†</span>'}
function st(c){return ''}
var state={tab:"kupa",sel:null};
function total(){return clubs.reduce(function(a,c){return a+c.kupa},0)}
function sorted(){return clubs.slice().sort(function(a,b){return b.kupa-a.kupa})}
function mayor(c){return c.name?c.nick+" ("+c.name+")":"—"}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}

function comment(c,pos,s){
  var lead=s[0],t=total(),pct=Math.round(c.kupa/t*100),out=[];
  if(c.rip) out.push(c.club+" tarihe karıştı ama 2 kupasıyla ligde "+pos+". sırada kalıyor.");
  else if(pos===1) out.push(c.club+" "+c.kupa+" kupayla zirvede; ikinciyle arasında "+(c.kupa-s[1].kupa)+" kupa var.");
  else out.push(c.club+" "+pos+". sırada, lidere "+(lead.kupa-c.kupa)+" kupa uzakta.");
  out.push("Toplam "+t+" kupanın %"+pct+"'ini topluyor.");
  if(c.kupa===0) out.push("Henüz kupa yok, ilk kupa için yer açık.");
  if(c.rank) out.push(c.name+" aynı zamanda "+c.rank+".");
  return out.join(" ");
}

function apply(d){

}

}

  finally{showNotes()}
}
function hostGH(l){var h=l.hostname||"";if(/\.github\.io$/.test(h)){return {u:h.split(".")[0],r:(l.pathname||"").split("/").filter(Boolean)[0]||""}}return null}
async function pullAdmin(){
  if(RO||(window.claude&&window.claude.use)||!GH||!GH.t)return "off";
  try{
    var r=await fetch(ghUrl(GH),{headers:{"Accept":"application/vnd.github.raw+json","Authorization":"Bearer "+GH.t},cache:"no-store"});
    if(r.status===404)return "none";
    if(!r.ok)return "error";
    var j=await r.json();
    if(!j||!j.d)return "none";
    if(j.ts>lastEdit){apply(JSON.parse(b64d(j.d)));lastEdit=j.ts;try{localStorage.setItem(KEY,JSON.stringify(snap()));localStorage.setItem("chapo_ts",String(lastEdit))}catch(e){}render();return "applied"}
    return j.ts<lastEdit?"local-newer":"same";
  }catch(e){return "error"}
}
function startPull(){
  async function pull(){
    try{
      var r=await fetch(ghUrl(GH),{headers:{"Accept":"application/vnd.github.raw+json"},cache:"no-store"});
      if(!r.ok)return;
      var j=await r.json();
      if(j&&j.d&&j.ts>seedTS){apply(JSON.parse(b64d(j.d)));seedTS=j.ts;render()}
    }catch(e){}
  }
  pull();setInterval(pull,120000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()});
}
function dbSchedule(){if(RO)return;dbDirty=true;clearTimeout(dbTimer);dbTimer=setTimeout(dbFlush,600)}
async function dbFlush(){
  if(RO)return;
  if(dbBusy){clearTimeout(dbTimer);dbTimer=setTimeout(dbFlush,400);return}
  if(!dbDirty)return;
  dbBusy=true;dbDirty=false;
  var t=b64e(JSON.stringify(snap()));
  if(dbH){
    try{
      var n=Math.max(1,Math.ceil(t.length/180000));
      for(var i=0;i<n;i++)await dbH.doc("state/part"+i).set({s:t.slice(i*180000,(i+1)*180000)});
      await dbH.doc("state/meta").set({n:n,ts:Date.now()});
      dbFail=0;cloudMsg("Buluta kaydedildi ✓ "+hhmm());
    }catch(e){
      dbFail++;dbDirty=true;
      cloudMsg("Buluta kaydedilemedi"+(dbFail<4?", tekrar deneniyor…":". Yedek kodu al."));
      if(dbFail<4){clearTimeout(dbTimer);dbTimer=setTimeout(dbFlush,4000)}
    }
  }
  await syncPush(t);
  dbBusy=false;
  if(dbDirty&&dbFail===0)dbSchedule();
}
async function dbRead(h){
  var m=await h.doc("state/meta").get();if(!m.exists)return null;
  var n=m.data().n,t="";
  for(var i=0;i<n;i++){var p=await h.doc("state/part"+i).get();if(!p.exists)return null;t+=p.data().s}
  return {t:t,ts:m.data().ts};
}
async function initCloud(){
  if(RO||!window.claude||!window.claude.use)return;
  try{
    var u=await window.claude.use("user"),h=await window.claude.use("db");
    var own=u?await u.isOwner():false;
    if(!own){
      RO=true;roUI();
      if(h){try{var r=await dbRead(h);if(r){apply(JSON.parse(b64d(r.t)));seedTS=r.ts||0}}catch(e){}}
      render();return;
    }
    if(!h)return;
    var r2=null;
    try{r2=await dbRead(h)}catch(e){cloudMsg("Bulut okunamadı, bu tarayıcıdaki kayıt kullanılıyor.");return}
    if(r2){apply(JSON.parse(b64d(r2.t)));try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}dbH=h;cloudMsg("Buluttan yüklendi ✓ "+hhmm());render()}
    else{dbH=h;dbDirty=true;dbFlush();render()}
  }catch(e){}
}
document.getElementById("main").addEventListener("click",async function(e){
  var b=e.target.closest("[data-bk]");if(!b)return;
  var ta=document.getElementById("bkcode"),msg=document.getElementById("bkmsg"),a=b.dataset.bk;
  if(a==="get"){ta.value=b64e(JSON.stringify(snap()));msg.textContent="Kod hazır."}
  else if(a==="gh"){
    var gu=(document.getElementById("gh-u").value||"").trim(),gr=(document.getElementById("gh-r").value||"").trim(),gt=(document.getElementById("gh-t").value||"").trim();
    if(!gu||!gr||!gt){msg.textContent="Üç kutuyu da doldur.";return}
    GH={u:gu,r:gr,t:gt};try{localStorage.setItem("chapo_gh",JSON.stringify(GH))}catch(x){}
    msg.textContent="Deneniyor…";
    var st=await pullAdmin();
    if(st==="applied"){bkmsg="Veriler GitHub'dan alındı ✓";render()}
    else if(st==="none"||st==="local-newer"){dbDirty=true;await dbFlush();msg.textContent=syncNote||"Tamam."}
    else if(st==="same"){msg.textContent="Bağlandı ✓ Veriler güncel."}
    else{msg.textContent="GitHub'a bağlanılamadı. Kullanıcı adı, depo adı ve anahtarı kontrol et."}
  }
  else if(a==="zip"){
    msg.textContent="ZIP hazırlanıyor…";
    try{
      var enc=new TextEncoder(),z=makeZip([
        {name:"Chapocikolik/OKU-BENI.txt",data:enc.encode("\ufeff"+README)},
        {name:"Chapocikolik/Chapocikolik-Baslat.bat",data:enc.encode(BAT)},
        {name:"Chapocikolik/Masaustune-Kisayol-Olustur.bat",data:enc.encode(kisayolBat("Chapocikolik-Baslat.bat"))},
        {name:"Chapocikolik/Chapocikolik-simge.ico",data:icoBytes()},
        {name:"Chapocikolik/chapoci-kupa-merkezi.html",data:enc.encode(buildFriendHTML())}
      ]);
      offerFile("Chapocikolik-Windows.zip",z).then(function(){msg.textContent="ZIP indirildi. Bunu arkadaşlara gönder."},function(x){msg.textContent=(x&&x.code==="declined")?"İndirme iptal edildi.":"İndirme başarısız oldu."});
    }catch(x){msg.textContent="ZIP hazırlanamadı."}
  }
  else if(a==="prev"){
    try{var pr=localStorage.getItem(KEY+"_prev");apply(JSON.parse(pr));localStorage.removeItem(KEY+"_prev");save();bkmsg="Önceki kaydına dönüldü.";render()}catch(x){msg.textContent="Önceki kayıt bulunamadı."}
  }
  else if(a==="copy"){
    if(!ta.value)ta.value=b64e(JSON.stringify(snap()));
    ta.select();var ok=false;
    try{ok=document.execCommand("copy")}catch(x){}
    try{navigator.clipboard.writeText(ta.value);ok=true}catch(x){}
    msg.textContent=ok?"Kopyalandı.":"Kodu seçip elle kopyala.";
  }else{
    try{apply(JSON.parse(b64d(ta.value.trim())));save();bkmsg="Yedek yüklendi.";render()}catch(x){msg.textContent="Kod geçersiz."}
  }
});
function render(){
  document.getElementById("tot").textContent="Toplam kupa: "+total();
  document.getElementById("main").innerHTML=(RO?roBanner():"")+{kupa:renderKupa,bsk:renderBsk,rut:renderRut,lig:renderLig,gol:renderGol,od:renderOd}[state.tab]();
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.setAttribute("aria-selected",b.dataset.t===state.tab)});

document.getElementById("main").addEventListener("click",function(e){
  var a=e.target.closest("[data-add]");
  if(a){clubs.filter(function(c){return c.id===a.dataset.add})[0].kupa++;state.sel=a.dataset.add;save();render();return}

  var r=e.target.closest(".row");if(r){state.sel=state.sel===r.dataset.id?null:r.dataset.id;render()}

document.getElementById("main").addEventListener("keydown",function(e){

  if(r&&e.target===r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();state.sel=r.dataset.id;render()}
});

if(RO){roUI();if(GH)startPull()}else{initCloud();pullAdmin();document.addEventListener("visibilitychange",function(){if(!document.hidden&&!RO&&!dbDirty)pullAdmin()})}
